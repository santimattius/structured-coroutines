name: API docs

# Builds the :runtime Dokka HTML and publishes it to this repository's GitHub Pages
# (https://santimattius.github.io/structured-coroutines/). The narrative docs site lives in
# the separate structured-coroutines-docs repository.
on:
  push:
    branches: [ main ]
    paths:
      - "runtime/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/docs-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build :runtime API docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate Dokka HTML
        run: ./gradlew :runtime:dokkaGeneratePublicationHtml --no-daemon

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: runtime/build/dokka/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
