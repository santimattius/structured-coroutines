name: CI

on:
  pull_request:
    # TEMPORARY: the feature branch is listed so PRs and pushes into it run CI.
    # Remove `feat/coroutines-toolkit-runtime` before merging the feature into main.
    branches: [ main, feat/coroutines-toolkit-runtime ]
  push:
    branches: [ main, feat/coroutines-toolkit-runtime ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────
  # Core modules: compiler, detekt-rules, lint-rules
  # ──────────────────────────────────────────────
  test-core:
    name: Test core modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Run tests
        run: ./gradlew :compiler:test :detekt-rules:test :lint-rules:test :runtime:jvmTest :runtime:jsTest :runtime:linuxX64Test :runtime-test:jvmTest :runtime-test:jsTest :runtime-test:linuxX64Test :runtime-tracing-jvm:test --no-daemon

      - name: Check :runtime, :runtime-test and :runtime-tracing-jvm binary compatibility (advisory)
        # :runtime is on the @ExperimentalStructuredCoroutines-gated 0.x line — an ABI diff is
        # surfaced in the job log/PR but must never fail CI. Non-blocking until 1.0.0, when the
        # experimental gate is removed (see build.gradle.kts apiValidation comment).
        run: ./gradlew :runtime:apiCheck :runtime-test:apiCheck :runtime-tracing-jvm:apiCheck --no-daemon
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Kotlin forward-compat smoke signal (readiness only)
  # Recompiles the compiler checker sources against the test-scope-only
  # `forward-compat-kotlin` coordinate (Kotlin 2.4.20). Advisory only: a
  # failure here means a future Kotlin bump will need work, but it must
  # never block this pipeline. See docs/KOTLIN_2_4_READINESS_CHECKLIST.md.
  # ──────────────────────────────────────────────
  forward-compat:
    name: Kotlin forward-compat smoke test (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Smoke-compile against Kotlin 2.4.20 (forward-compat-kotlin)
        run: ./gradlew :compiler:forwardCompatTest --no-daemon

  # ──────────────────────────────────────────────
  # IntelliJ plugin: compile + instrument
  # (no test sources; compilation against IJ 2026.1 is the verification)
  # ──────────────────────────────────────────────
  build-intellij:
    name: Build IntelliJ plugin (2026.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile IntelliJ plugin
        run: ./gradlew :intellij-plugin:compileKotlin :intellij-plugin:instrumentCode --no-daemon
