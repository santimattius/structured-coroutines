name: Publish

permissions:
  contents: read

on:
  release:
    types: [released, prereleased]

jobs:
  publish:
    if: ${{ !startsWith(github.event.release.tag_name, 'runtime-v') }}
    name: Release build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Validate toolkit release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          project_version=$(grep '^PROJECT_VERSION=' \
            gradle.properties | cut -d= -f2-)
          expected="v${project_version}"
          actual="$RELEASE_TAG"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Toolkit release tag must be $expected."
            echo "Runtime releases use runtime-v<RUNTIME_VERSION>."
            exit 1
          fi

      - name: Publish toolkit artifacts to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
